# Airport payments: Spark + Kafka lab (laptop, Docker Compose).
# Core (no profile, `docker compose up -d --wait`): Kafka, Schema Registry, Kafka UI, MinIO, Spark. Labs 01-07, 09, 12.
# Profiles (pulled and started only when a lab needs them, `docker compose --profile <name> up -d --wait`):
#   cdc (Lab 08): Postgres, Kafka Connect/Debezium · monitoring (Lab 10): Prometheus, Pushgateway, kafka-exporter, Grafana
#   orchestration (Lab 11): Prefect server
# Host ports: Kafka 9094 · Kafka UI 8080 · Schema Registry 8081 · Spark master UI 8082 · Connect 8083
#             MinIO 9000 (API) / 9001 (console) · Spark app UI 4040 · Spark master 7077
#             Postgres 5432 · Prefect 4200 · Prometheus 9090 · Pushgateway 9091 · Grafana 3000 · Kafka exporter 9308
name: airport-spark-kafka

x-spark-env: &spark-env
  PYSPARK_PYTHON: python3

services:
  # ───────────── Kafka (KRaft, no ZooKeeper) ─────────────
  kafka:
    image: apache/kafka:4.4.0
    container_name: kafka
    restart: unless-stopped
    mem_limit: 1g
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data   # on the kafka_data volume, so `docker compose down` keeps topics and offsets
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:                       # one-shot: topics (3 partitions = up to 3 parallel consumers)
    image: apache/kafka:4.4.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in airport.transactions airport.fraud-alerts; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic $$t --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0       # maintained fork; provectuslabs/kafka-ui is unmaintained
    container_name: kafka-ui
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: airport-lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    depends_on:
      kafka: {condition: service_healthy}

  schema-registry:
    image: confluentinc/cp-schema-registry:8.4.1
    container_name: schema-registry
    restart: unless-stopped
    mem_limit: 512m
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms128m -Xmx256m"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      # cp-schema-registry 8.x ships without curl
      test: ["CMD", "python3", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8081/subjects', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 24
    depends_on:
      kafka: {condition: service_healthy}

  # ───────────── CDC: Postgres + Debezium (Kafka Connect) ─────────────
  postgres:
    image: postgres:16-alpine
    profiles: [cdc]
    container_name: postgres
    restart: unless-stopped
    mem_limit: 256m
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: airport
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d airport"]
      interval: 5s
      retries: 10

  kafka-connect:
    image: quay.io/debezium/connect:3.7.1.Final
    profiles: [cdc]
    container_name: kafka-connect
    restart: unless-stopped
    mem_limit: 1g
    ports: ["8083:8083"]
    environment:
      HEAP_OPTS: "-Xms256m -Xmx640m"   # image default -Xmx2G exceeds mem_limit and gets killed at start-up
      CONNECT_PLUGIN_DISCOVERY: service_load   # skip the slow reflective scan of every bundled connector
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: "1"
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
    depends_on:
      kafka: {condition: service_healthy}

  # ───────────── Object storage (S3 API) ─────────────
  minio:
    # Archived image for local training; upstream public Docker Hub images are gone.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: minio
    restart: unless-stopped
    mem_limit: 512m
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    volumes: [minio_data:/bitnami/minio/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio-init:                       # one-shot: buckets for each layer
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    container_name: minio-init
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        for bucket in bronze silver gold checkpoints quarantine; do mc mb --ignore-existing local/$$bucket || exit 1; done
    restart: "no"

  minio-client:                     # long-running mc for the lab; ./data is mounted for bronze uploads
    image: bitnamilegacy/minio-client:2025.7.21-debian-12-r3
    container_name: minio-client
    environment:
      MC_CONFIG_DIR: /tmp/.mc
    restart: unless-stopped
    mem_limit: 64m
    volumes: ["./data:/data:ro"]
    depends_on:
      minio-init: {condition: service_completed_successfully}
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && sleep infinity"]

  # ───────────── Spark (master + worker) ─────────────
  spark-master:
    image: ghcr.io/majlisofai/advanced-data-engineering-spark:4.2.0   # jars baked in; see spark/Dockerfile
    build: ./spark                  # fallback: `docker compose build` if the published image is unavailable
    container_name: spark-master
    restart: unless-stopped
    mem_limit: 1536m
    ports:
      - "7077:7077"
      - "8082:8080"                 # master UI
      - "4040:4040"                 # application UI (jobs run in client mode here)
    environment:
      <<: *spark-env
      SPARK_LOCAL_HOSTNAME: spark-master
      PUSHGATEWAY_URL: http://pushgateway:9091
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - ./spark/jobs:/opt/spark-apps:ro
      - ./data:/opt/spark-data:ro
      - ./spark/conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro   # settings for every spark-submit
    depends_on:
      minio-init: {condition: service_completed_successfully}
      kafka-init: {condition: service_completed_successfully}   # topics exist; also lets `up --wait` accept the one-shot exit

  spark-worker:
    image: ghcr.io/majlisofai/advanced-data-engineering-spark:4.2.0
    build: ./spark
    container_name: spark-worker
    restart: unless-stopped
    mem_limit: 2g
    environment:
      <<: *spark-env
      SPARK_LOCAL_HOSTNAME: spark-worker
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: 1024m
      SPARK_WORKER_WEBUI_PORT: "8091"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    volumes:
      - ./data:/opt/spark-data:ro  # evaluate.py reads labels in executor tasks too.
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import json; from urllib.request import urlopen;
          assert any(w['host'] == 'spark-worker' and w['state'] == 'ALIVE'
          for w in json.load(urlopen('http://spark-master:8080/json/', timeout=3))['workers'])
      interval: 5s
      timeout: 4s
      retries: 12
    depends_on:
      spark-master: {condition: service_healthy}

  # ───────────── Orchestration (Prefect) ─────────────
  prefect-server:
    image: prefecthq/prefect:3.9.4-python3.12
    profiles: [orchestration]
    container_name: prefect-server
    restart: unless-stopped
    mem_limit: 512m
    ports: ["4200:4200"]
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    volumes: [prefect_data:/root/.prefect]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:4200/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 24

  # ───────────── Monitoring ─────────────
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [monitoring]
    container_name: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=2d"]

  pushgateway:
    image: prom/pushgateway:v1.11.5
    profiles: [monitoring]
    container_name: pushgateway
    ports: ["9091:9091"]

  kafka-exporter:                   # consumer lag per group / topic / partition
    image: danielqsj/kafka-exporter:v1.11.0
    profiles: [monitoring]
    container_name: kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    ports: ["9308:9308"]
    depends_on:
      kafka: {condition: service_healthy}

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [monitoring]
    container_name: grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]

volumes:
  kafka_data:
  minio_data:
  postgres_data:
  prefect_data:
  prometheus_data:
  grafana_data:
