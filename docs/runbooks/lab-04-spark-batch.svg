<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" role="img" aria-labelledby="title desc">
  <title id="title">Replay one day without replacing the table</title>
  <desc id="desc">Two Delta versions have three illustrated partitions. Only the selected middle partition is rewritten. Its row contents remain equal; adjacent partitions stay untouched.</desc>
  <rect width="880" height="272" fill="#ffffff"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif" fill="#111111">
    <text x="24" y="28" font-size="14" font-weight="600" letter-spacing="2" fill="#5c5c5c">LAB 04</text>
    <text x="24" y="60" font-size="27">Replay one day without replacing the table</text>
    <path d="M24 74H856" stroke="#d9d9d9"/>
    <g fill="#f5f5f5">
      <path d="M184 103h208v48H184zm232 0h208v48H416zm232 0h208v48H648z"/>
      <path d="M184 184h208v48H184zm464 0h208v48H648z"/>
    </g>
    <path d="M288 151v33m232-33v33m232-33v33" stroke="#767676" fill="none"/>
    <rect x="416" y="184" width="208" height="48" fill="#ffffff" stroke="#cc3a1c" stroke-width="3"/>
    <g font-size="16" font-weight="600">
      <text x="24" y="132">Before replay</text><text x="24" y="213">After replay</text>
      <g text-anchor="middle">
        <text x="288" y="132">Earlier day</text><text x="520" y="132">Selected day</text><text x="752" y="132">Later day</text>
        <text x="288" y="213">Untouched</text><text x="520" y="213">Rewritten, same rows</text><text x="752" y="213">Untouched</text>
      </g>
    </g>
    <text x="416" y="255" font-size="14" fill="#5c5c5c">Delta replaceWhere limits the write to one date.</text>
  </g>
</svg>
