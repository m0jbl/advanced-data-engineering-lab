<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" role="img" aria-labelledby="title desc">
  <title id="title">Retry the task, not the decision</title>
  <desc id="desc">Generate, load bronze, build silver, build features, and score are ordered before the precision gate. The four middle tasks can retry. The gate fails the run without retrying the decision.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111111"/></marker></defs>
  <rect width="880" height="272" fill="#ffffff"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif" fill="#111111">
    <text x="24" y="28" font-size="14" font-weight="600" letter-spacing="2" fill="#5c5c5c">LAB 11</text>
    <text x="24" y="60" font-size="27">Retry the task, not the decision</text>
    <path d="M24 74H856" stroke="#d9d9d9"/>
    <g fill="#f5f5f5"><rect x="24" y="120" width="112" height="72"/><rect x="168" y="120" width="112" height="72"/><rect x="312" y="120" width="112" height="72"/><rect x="456" y="120" width="112" height="72"/><rect x="600" y="120" width="112" height="72"/></g>
    <rect x="744" y="120" width="112" height="72" fill="#ffffff" stroke="#cc3a1c" stroke-width="3"/>
    <g stroke="#111111" fill="none" marker-end="url(#arrow)"><path d="M142 156H162"/><path d="M286 156H306"/><path d="M430 156H450"/><path d="M574 156H594"/><path d="M718 156H738"/></g>
    <g font-size="16" font-weight="600" text-anchor="middle"><text x="80" y="162">Generate</text><text x="224" y="162">Load bronze</text><text x="368" y="162">Build silver</text><text x="512" y="162">Build features</text><text x="656" y="162">Score day</text><text x="800" y="152">Precision</text><text x="800" y="174">gate</text></g>
    <path d="M168 208V216H712V208" stroke="#999999" fill="none"/>
    <g font-size="14" fill="#5c5c5c" text-anchor="middle"><text x="440" y="240">Up to two retries per task</text><text x="800" y="240">No retry</text></g>
  </g>
</svg>
