<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" role="img" aria-labelledby="title desc">
  <title id="title">Two paths into Prometheus</title>
  <desc id="desc">Kafka offsets reach Prometheus through the Kafka exporter; Spark batch counts reach it through the Pushgateway. Prometheus evaluates alert rules and Grafana displays the signals.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111111"/></marker></defs>
  <rect width="880" height="272" fill="#ffffff"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif" fill="#111111">
    <text x="24" y="28" font-size="14" font-weight="600" letter-spacing="2" fill="#5c5c5c">LAB 10</text>
    <text x="24" y="60" font-size="27">Two paths into Prometheus</text>
    <path d="M24 74H856" stroke="#d9d9d9"/>
    <g fill="#f5f5f5"><path d="M24 96H208V160H24ZM24 184H208V248H24Z"/><path d="M248 96H432V160H248ZM248 184H432V248H248Z"/><rect x="712" y="124" width="144" height="96"/></g>
    <rect x="488" y="124" width="184" height="96" fill="#ffffff" stroke="#cc3a1c" stroke-width="3"/>
    <g stroke="#111111" fill="none" marker-end="url(#arrow)"><path d="M216 128H240"/><path d="M216 216H240"/><path d="M440 128H456V148H480"/><path d="M440 216H456V196H480"/><path d="M680 172H704"/></g>
    <g font-size="18" font-weight="600"><text x="40" y="124">Kafka offsets</text><text x="40" y="212">Spark batch</text><text x="264" y="124">Kafka exporter</text><text x="264" y="212">Pushgateway</text><text x="504" y="166">Prometheus</text><text x="728" y="166">Grafana</text></g>
    <g font-size="14" fill="#5c5c5c"><text x="40" y="146">Committed vs. latest</text><text x="40" y="234">Payments and alerts</text><text x="264" y="146">Exposes lag</text><text x="264" y="234">Holds pushed counts</text><text x="504" y="188">Scrapes and evaluates</text><text x="728" y="188">Graphs signals</text></g>
  </g>
</svg>
