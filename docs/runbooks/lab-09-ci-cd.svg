<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" role="img" aria-labelledby="title desc">
  <title id="title">A passing rule test is not a release decision</title>
  <desc id="desc">The unit test checks the four-times amount ratio. A labeled threshold sweep compares alert precision and recall. Use both, with a held-out check, to decide what to ship.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111111"/></marker></defs>
  <rect width="880" height="272" fill="#ffffff"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif" fill="#111111">
    <text x="24" y="28" font-size="14" font-weight="600" letter-spacing="2" fill="#5c5c5c">LAB 09</text>
    <text x="24" y="60" font-size="27">A passing rule test is not a release decision</text>
    <path d="M24 74H856" stroke="#d9d9d9"/>
    <rect x="24" y="96" width="368" height="64" fill="#f5f5f5"/>
    <rect x="24" y="176" width="368" height="64" fill="#f5f5f5"/>
    <rect x="536" y="126" width="320" height="84" fill="#ffffff" stroke="#cc3a1c" stroke-width="3"/>
    <path d="M408 128H464V208H408" stroke="#111111" fill="none"/>
    <path d="M464 168H520" stroke="#111111" fill="none" marker-end="url(#arrow)"/>
    <g font-size="19" font-weight="600"><text x="40" y="123">Rule boundary test</text><text x="40" y="203">Alert threshold sweep</text><text x="552" y="162">Release decision</text></g>
    <g font-size="15" fill="#5c5c5c"><text x="40" y="146">Does the 4× ratio trigger as intended?</text><text x="40" y="226">How do precision and recall change?</text><text x="552" y="186">Require a held-out, time-ordered check</text></g>
  </g>
</svg>
