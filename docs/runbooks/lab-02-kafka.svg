<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 288" role="img" aria-labelledby="title desc">
  <title id="title">A backlog is a gap between two offsets</title>
  <desc id="desc">On an illustrative Kafka partition, a stopped group has committed 42 while the log end is 45. Records 42 through 44 are three records behind. Each group tracks its own offset.</desc>
  <rect width="880" height="288" fill="#ffffff"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif" fill="#111111">
    <text x="24" y="28" font-size="14" font-weight="600" letter-spacing="2" fill="#5c5c5c">MAJLIS ACADEMY / LAB 02</text>
    <text x="24" y="60" font-size="27">A backlog is a gap between two offsets</text>
    <path d="M24 74H856" stroke="#d9d9d9"/>
    <text x="24" y="106" font-size="16" fill="#5c5c5c">Illustrative partition · each group commits its own position</text>
    <rect x="144" y="128" width="118" height="56" fill="#f5f5f5"/>
    <rect x="272" y="128" width="384" height="56" fill="#ffffff" stroke="#cc3a1c" stroke-width="3"/>
    <path d="M400 128V184M528 128V184" stroke="#d9d9d9"/>
    <g font-family="IBM Plex Mono, monospace" font-size="23" text-anchor="middle"><text x="203" y="164">41</text><text x="336" y="164">42</text><text x="464" y="164">43</text><text x="592" y="164">44</text></g>
    <g fill="#5c5c5c" font-size="16"><text x="272" y="218" text-anchor="middle">Committed offset: 42</text><text x="656" y="218" text-anchor="middle">Log end: 45</text></g>
    <text x="464" y="260" text-anchor="middle" font-size="22" font-weight="600" fill="#cc3a1c">45 − 42 = 3 records behind</text>
  </g>
</svg>
