<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" role="img" aria-labelledby="title desc">
  <title id="title">Each sink resumes from its own checkpoint</title>
  <desc id="desc">Kafka payments enter Spark, which uses static daily features. Spark writes Kafka alerts and Delta decisions, with independent offset and commit logs. A third quarantine stream is not shown.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111111"/></marker></defs>
  <rect width="880" height="272" fill="#ffffff"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif" fill="#111111">
    <text x="24" y="28" font-size="14" font-weight="600" letter-spacing="2" fill="#5c5c5c">LAB 05</text>
    <text x="24" y="60" font-size="27">Each sink resumes from its own checkpoint</text>
    <path d="M24 74H856" stroke="#d9d9d9"/>
    <g fill="#f5f5f5">
      <rect x="24" y="128" width="216" height="72"/><rect x="288" y="128" width="224" height="72"/>
      <rect x="576" y="88" width="280" height="72"/>
    </g>
    <rect x="576" y="168" width="280" height="72" fill="#ffffff" stroke="#cc3a1c" stroke-width="3"/>
    <g stroke="#111111" fill="none" marker-end="url(#arrow)">
      <path d="M248 164h32"/><path d="M520 164h16v-40h32"/><path d="M520 164h16v40h32"/>
    </g>
    <g font-size="18" font-weight="600">
      <text x="40" y="157">Kafka payments</text><text x="304" y="157">Spark rule scorer</text>
      <text x="592" y="117">Kafka alerts</text><text x="592" y="197">Delta score rows</text>
    </g>
    <g font-size="14" fill="#5c5c5c">
      <text x="40" y="181">Read by partition offset</text><text x="304" y="181">Joins static daily features</text>
      <text x="592" y="141">Alert query checkpoint</text><text x="592" y="221">Score query checkpoint</text>
      <text x="576" y="262">Quarantine query not shown.</text>
    </g>
  </g>
</svg>
