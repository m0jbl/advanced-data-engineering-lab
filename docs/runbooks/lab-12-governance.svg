<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" role="img" aria-labelledby="title desc">
  <title id="title">Remove direct identifiers, not every link</title>
  <desc id="desc">The masking job removes the transaction and passenger identifiers. The output retains a stable passenger key and payment attributes, so it is pseudonymous and still requires access controls.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111111"/></marker></defs>
  <rect width="880" height="272" fill="#ffffff"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif" fill="#111111">
    <text x="24" y="28" font-size="14" font-weight="600" letter-spacing="2" fill="#5c5c5c">LAB 12</text>
    <text x="24" y="60" font-size="27">Remove direct identifiers, not every link</text>
    <path d="M24 74H856" stroke="#d9d9d9"/>
    <rect x="24" y="104" width="240" height="120" fill="#f5f5f5"/>
    <rect x="320" y="104" width="240" height="120" fill="#f5f5f5"/>
    <rect x="616" y="104" width="240" height="120" fill="#ffffff" stroke="#cc3a1c" stroke-width="3"/>
    <g stroke="#111111" fill="none" marker-end="url(#arrow)"><path d="M272 164H312"/><path d="M568 164H608"/></g>
    <g font-size="18" font-weight="600"><text x="40" y="136">Silver payments</text><text x="336" y="136">Masking job</text><text x="632" y="136">Analyst dataset</text></g>
    <g font-size="14" fill="#5c5c5c"><text x="40" y="164">passenger_id, transaction_id</text><text x="40" y="188">Payment attributes</text><text x="336" y="164">Hash passenger ID with salt</text><text x="336" y="188">Drop both original IDs</text><text x="632" y="164">passenger_key + attributes</text><text x="632" y="188">Pseudonymous; still linkable</text></g>
  </g>
</svg>
