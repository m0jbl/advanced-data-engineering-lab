<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" role="img" aria-labelledby="title desc">
  <title id="title">Can the new schema read old payments?</title>
  <desc id="desc">Under backward compatibility, adding optional gate_id is accepted, while renaming the required amount field is rejected because old payments lack the new name.</desc>
  <defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#111111"/></marker></defs>
  <rect width="880" height="272" fill="#ffffff"/>
  <g font-family="IBM Plex Sans, Arial, sans-serif" fill="#111111">
    <text x="24" y="28" font-size="14" font-weight="600" letter-spacing="2" fill="#5c5c5c">MAJLIS ACADEMY / LAB 03</text>
    <text x="24" y="60" font-size="27">Can the new schema read old payments?</text>
    <path d="M24 74H856" stroke="#d9d9d9"/>
    <rect x="24" y="125" width="240" height="84" fill="#f5f5f5"/>
    <path d="M280 167H312" stroke="#111111" fill="none"/>
    <g stroke="#111111" fill="none" marker-end="url(#arrow)"><path d="M312 167V128H368"/><path d="M312 167V208H368"/></g>
    <rect x="384" y="96" width="472" height="64" fill="#f5f5f5"/>
    <rect x="384" y="176" width="472" height="64" fill="#ffffff" stroke="#cc3a1c" stroke-width="3"/>
    <g font-size="19" font-weight="600"><text x="40" y="162">Old payment</text><text x="400" y="123">Add optional gate_id</text><text x="400" y="203">Rename required amount</text></g>
    <g font-size="15" fill="#5c5c5c"><text x="40" y="186">Has amount, no gate_id</text><text x="400" y="146">Accepted · old payments still pass</text><text x="400" y="226">Rejected · old payments lack the new field</text></g>
  </g>
</svg>
