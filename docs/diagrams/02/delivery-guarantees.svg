<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 800" width="1090" height="800"><rect width="1090" height="800" fill="#FFFFFF"/><rect x="24" y="560" width="802" height="170" rx="8" fill="#FFFFFF" stroke="#CC3A1C" stroke-width="2"/><text x="425.0" y="635" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#CC3A1C" text-anchor="middle">At-most-once</text><text x="425.0" y="680" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#5C5C5C" text-anchor="middle">may lose</text><rect x="144" y="320" width="802" height="170" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/><text x="545.0" y="395" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#111111" text-anchor="middle">At-least-once</text><text x="545.0" y="440" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#5C5C5C" text-anchor="middle">may duplicate</text><rect x="264" y="80" width="802" height="170" rx="8" fill="#CC3A1C" stroke="#CC3A1C" stroke-width="2"/><text x="665.0" y="155" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Exactly-once</text><text x="665.0" y="200" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="22" font-weight="normal" fill="#FFFFFF" text-anchor="middle">transactions or idempotent sink</text></svg>
