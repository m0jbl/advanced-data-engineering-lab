<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 520" width="1230" height="520">
<style>
.t{font-family:IBM Plex Sans;font-size:24px;fill:#111111}
.h{font-family:IBM Plex Sans Light;font-size:30px;fill:#111111}
.s{font-family:IBM Plex Sans;font-size:22px;fill:#5C5C5C}
.c{text-anchor:middle}
.w{fill:#FFFFFF}
.r{fill:#CC3A1C}
.task{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.slow{fill:#CC3A1C}
.idle{fill:#FFFFFF;stroke:#767676;stroke-width:2;stroke-dasharray:8 8}
.ln{stroke:#111111;stroke-width:3;fill:none}
.ar{fill:#111111}
</style>
<text x="24" y="60" class="h">8 tasks on 2 cores = 4 waves</text>
<text x="260" y="130" class="s c">wave 1</text><text x="450" y="130" class="s c">wave 2</text><text x="640" y="130" class="s c">wave 3</text><text x="830" y="130" class="s c">wave 4</text>
<text x="24" y="203" class="t">core 1</text>
<rect class="task" x="170" y="150" width="180" height="90" rx="8"/><text x="260" y="203" class="t c">task 1</text>
<rect class="task" x="360" y="150" width="180" height="90" rx="8"/><text x="450" y="203" class="t c">task 3</text>
<rect class="task" x="550" y="150" width="180" height="90" rx="8"/><text x="640" y="203" class="t c">task 5</text>
<rect class="task" x="740" y="150" width="180" height="90" rx="8"/><text x="830" y="203" class="t c">task 7</text>
<rect class="idle" x="930" y="150" width="250" height="90" rx="8"/><text x="1055" y="203" class="s c">idle</text>
<text x="24" y="343" class="t">core 2</text>
<rect class="task" x="170" y="290" width="180" height="90" rx="8"/><text x="260" y="343" class="t c">task 2</text>
<rect class="task" x="360" y="290" width="180" height="90" rx="8"/><text x="450" y="343" class="t c">task 4</text>
<rect class="task" x="550" y="290" width="180" height="90" rx="8"/><text x="640" y="343" class="t c">task 6</text>
<rect class="slow" x="740" y="290" width="440" height="90" rx="8"/><text x="960" y="343" class="t c w">task 8: slow</text>
<line class="ln" x1="170" y1="430" x2="1170" y2="430"/><polygon class="ar" points="1168,421 1184,430 1168,439"/>
<text x="1184" y="472" class="s" style="text-anchor:end">time</text>
<text x="170" y="472" class="t r">Slowest task sets stage time</text>
</svg>
