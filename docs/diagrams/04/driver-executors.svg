.ar{fill:#111111}
.r{fill:#CC3A1C}
</style>
<rect class="dark" x="345" y="40" width="400" height="130" rx="14"/>
<text x="545" y="96" class="t c w">Driver</text>
<text x="545" y="136" class="s c w">plans jobs and tasks</text>
<path class="ln" d="M545 170 V240 H280 V314"/><polygon class="ar" points="271,312 280,328 289,312"/>
<path class="ln" d="M545 240 H810 V314"/><polygon class="ar" points="801,312 810,328 819,312"/>
<text x="560" y="226" class="s">tasks</text>
<rect class="box" x="60" y="330" width="440" height="300" rx="14"/>
<text x="280" y="380" class="t c">Executor</text>
<rect class="task" x="100" y="420" width="160" height="80" rx="10"/><text x="180" y="469" class="t c r">task</text>
<rect class="task" x="300" y="420" width="160" height="80" rx="10"/><text x="380" y="469" class="t c r">task</text>
<text x="180" y="540" class="s c">core 1</text><text x="380" y="540" class="s c">core 2</text>
<rect class="box" x="590" y="330" width="440" height="300" rx="14"/>
<text x="810" y="380" class="t c">Executor</text>
<rect class="task" x="630" y="420" width="160" height="80" rx="10"/><text x="710" y="469" class="t c r">task</text>
<rect class="task" x="830" y="420" width="160" height="80" rx="10"/><text x="910" y="469" class="t c r">task</text>
<text x="710" y="540" class="s c">core 1</text><text x="910" y="540" class="s c">core 2</text>
<text x="545" y="720" class="t c">One task per core</text>
</svg>
