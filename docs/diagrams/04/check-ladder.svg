<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 520" width="1230" height="520">
<style>
.t{font-family:IBM Plex Sans;font-size:22px;fill:#111111}
.h{font-family:IBM Plex Sans Light;font-size:30px;fill:#111111}
.s{font-family:IBM Plex Sans;font-size:20px;fill:#5C5C5C}
.m{font-family:IBM Plex Mono;font-size:20px;fill:#CC3A1C}
.c{text-anchor:middle}
.w{fill:#FFFFFF}
.box{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.dark{fill:#111111}
.ln{stroke:#111111;stroke-width:3;fill:none}
.lr{stroke:#CC3A1C;stroke-width:3;fill:none}
.ar{fill:#111111}
.arr{fill:#CC3A1C}
</style>
<text x="24" y="60" class="s">pass</text><text x="24" y="290" class="s">fail</text>
<rect class="box" x="24" y="100" width="140" height="120" rx="10"/><text x="94" y="152" class="t c">key</text><text x="94" y="182" class="t c">present?</text>
<rect class="box" x="197" y="100" width="140" height="120" rx="10"/><text x="267" y="168" class="t c">amount &gt; 0?</text>
<rect class="box" x="370" y="100" width="140" height="120" rx="10"/><text x="440" y="152" class="t c">known</text><text x="440" y="182" class="t c">airport?</text>
<rect class="box" x="543" y="100" width="140" height="120" rx="10"/><text x="613" y="168" class="t c">hour 0–23?</text>
<rect class="box" x="716" y="100" width="140" height="120" rx="10"/><text x="786" y="152" class="t c">valid</text><text x="786" y="182" class="t c">timestamp?</text>
<rect class="box" x="889" y="100" width="140" height="120" rx="10"/><text x="959" y="152" class="t c">inputs</text><text x="959" y="182" class="t c">present?</text>
<rect class="dark" x="1062" y="100" width="140" height="120" rx="10"/><text x="1132" y="168" class="t c w">accepted</text>
<line class="ln" x1="164" y1="160" x2="183" y2="160"/><polygon class="ar" points="183,152 197,160 183,168"/>
<line class="ln" x1="337" y1="160" x2="356" y2="160"/><polygon class="ar" points="356,152 370,160 356,168"/>
<line class="ln" x1="510" y1="160" x2="529" y2="160"/><polygon class="ar" points="529,152 543,160 529,168"/>
<line class="ln" x1="683" y1="160" x2="702" y2="160"/><polygon class="ar" points="702,152 716,160 702,168"/>
<line class="ln" x1="856" y1="160" x2="875" y2="160"/><polygon class="ar" points="875,152 889,160 875,168"/>
<line class="ln" x1="1029" y1="160" x2="1048" y2="160"/><polygon class="ar" points="1048,152 1062,160 1048,168"/>
<line class="lr" x1="94" y1="220" x2="94" y2="286"/><polygon class="arr" points="86,286 94,300 102,286"/>
<line class="lr" x1="267" y1="220" x2="267" y2="286"/><polygon class="arr" points="259,286 267,300 275,286"/>
<line class="lr" x1="440" y1="220" x2="440" y2="286"/><polygon class="arr" points="432,286 440,300 448,286"/>
<line class="lr" x1="613" y1="220" x2="613" y2="286"/><polygon class="arr" points="605,286 613,300 621,286"/>
<line class="lr" x1="786" y1="220" x2="786" y2="286"/><polygon class="arr" points="778,286 786,300 794,286"/>
<line class="lr" x1="959" y1="220" x2="959" y2="286"/><polygon class="arr" points="951,286 959,300 967,286"/>
<line class="ln" x1="1132" y1="220" x2="1132" y2="286"/><polygon class="ar" points="1124,286 1132,300 1140,286"/>
<text x="94" y="334" class="m c">NULL_KEY</text>
<text x="267" y="334" class="m c">NON_POSITIVE_</text><text x="267" y="360" class="m c">AMOUNT</text>
<text x="440" y="334" class="m c">UNKNOWN_</text><text x="440" y="360" class="m c">AIRPORT</text>
<text x="613" y="334" class="m c">BAD_HOUR</text>
<text x="786" y="334" class="m c">BAD_</text><text x="786" y="360" class="m c">TIMESTAMP</text>
<text x="959" y="334" class="m c">BAD_SCORING_</text><text x="959" y="360" class="m c">INPUT</text>
<text x="1132" y="334" class="t c">silver</text>
<text x="615" y="460" class="h c">First failure wins</text>
</svg>
