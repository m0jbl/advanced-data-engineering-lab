<rect class="cell" x="80" y="220" width="280" height="50"/><text x="220" y="254" class="m c">48.00</text>
<rect class="cell" x="80" y="270" width="280" height="50"/><text x="220" y="304" class="m c">7.90</text>
<text x="470" y="200" class="s c">inferred</text>
<line class="ln" x1="390" y1="220" x2="546" y2="220"/><polygon class="ar" points="544,211 560,220 544,229"/>
<rect class="cell" x="580" y="180" width="440" height="80" rx="10"/><text x="800" y="230" class="m c">amount: double</text>
