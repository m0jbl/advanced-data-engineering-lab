<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 800" width="1090" height="800">
<style>
.t{font-family:IBM Plex Sans;font-size:28px;fill:#111111}
.s{font-family:IBM Plex Sans;font-size:22px;fill:#5C5C5C}
.c{text-anchor:middle}
.w{fill:#FFFFFF}
.r{fill:#CC3A1C}
.box{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.hi{fill:#FFFFFF;stroke:#CC3A1C;stroke-width:4}
.dark{fill:#111111}
.ln{stroke:#111111;stroke-width:3;fill:none}
.lr{stroke:#CC3A1C;stroke-width:2;stroke-dasharray:6 6;fill:none}
.ar{fill:#111111}
</style>
<rect class="box" x="120" y="32" width="460" height="100" rx="12"/><text x="350" y="92" class="t c">DataFrame code</text>
<line class="ln" x1="350" y1="132" x2="350" y2="168"/><polygon class="ar" points="341,166 350,182 359,166"/>
<rect class="box" x="120" y="184" width="460" height="100" rx="12"/><text x="350" y="244" class="t c">Logical plan</text>
<line class="ln" x1="350" y1="284" x2="350" y2="320"/><polygon class="ar" points="341,318 350,334 359,318"/>
<rect class="hi" x="120" y="336" width="460" height="100" rx="12"/><text x="350" y="396" class="t c r">Optimized plan</text>
<line class="lr" x1="580" y1="386" x2="640" y2="386"/>
<text x="656" y="372" class="s">prune unused columns</text>
<text x="656" y="408" class="s">push filters to scan</text>
<line class="ln" x1="350" y1="436" x2="350" y2="472"/><polygon class="ar" points="341,470 350,486 359,470"/>
<rect class="dark" x="120" y="488" width="460" height="100" rx="12"/><text x="350" y="548" class="t c w">Physical plan</text>
<line class="lr" x1="580" y1="538" x2="640" y2="538"/>
<text x="656" y="546" class="s">join strategy chosen</text>
<line class="ln" x1="350" y1="588" x2="350" y2="624"/><polygon class="ar" points="341,622 350,638 359,622"/>
<rect class="box" x="120" y="640" width="460" height="100" rx="12"/><text x="350" y="700" class="t c">Tasks on executors</text>
</svg>
