<line class="lr" x1="804" y1="390" x2="870" y2="390"/><polygon class="arr" points="868,381 884,390 868,399"/>
<rect class="dark" x="884" y="80" width="322" height="100" rx="12"/>
<text x="1045" y="124" class="t c w">Silver Delta</text>
<text x="1045" y="158" class="s c w">by event_date</text>
<rect class="box" x="884" y="340" width="322" height="100" rx="12"/>
