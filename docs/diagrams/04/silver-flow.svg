<text x="124" y="286" class="s c">raw CSV</text>
<line class="ln" x1="224" y1="260" x2="270" y2="260"/><polygon class="ar" points="268,251 284,260 268,269"/>
<rect class="dark" x="284" y="200" width="220" height="120" rx="12"/>
<text x="394" y="252" class="t c w">Validate</text>
<text x="394" y="286" class="s c w">six checks</text>
<path class="ln" d="M504 260 H544 V130 H570"/><polygon class="ar" points="568,121 584,130 568,139"/>
<path class="lr" d="M544 260 V390 H570"/><polygon class="arr" points="568,381 584,390 568,399"/>
