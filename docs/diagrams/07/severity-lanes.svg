<text x="213" y="82" font-family="IBM Plex Sans" font-size="28" text-anchor="middle" fill="#FFFFFF" font-weight="700">Fail the job</text>
<text x="213" y="188" font-family="IBM Plex Sans" font-size="22" text-anchor="middle" fill="#5C5C5C">when</text>
