<rect x="426" y="376" width="378" height="96" rx="8" fill="#F5F5F5" stroke="#767676" stroke-width="2"/>
<text x="615" y="432" font-family="IBM Plex Sans" font-size="24" text-anchor="middle" fill="#111111">row set aside</text>
<rect x="828" y="24" width="378" height="96" rx="8" fill="#FFFFFF" stroke="#767676" stroke-width="2"/>
<text x="1017" y="82" font-family="IBM Plex Sans" font-size="28" text-anchor="middle" fill="#5C5C5C" font-weight="700">Warn and publish</text>
