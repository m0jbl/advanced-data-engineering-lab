<text x="615" y="82" font-family="IBM Plex Sans" font-size="28" text-anchor="middle" fill="#111111" font-weight="700">Quarantine the row</text>
<text x="615" y="188" font-family="IBM Plex Sans" font-size="22" text-anchor="middle" fill="#5C5C5C">when</text>
