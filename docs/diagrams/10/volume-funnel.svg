<line x1="460" y1="250" x2="460.0" y2="306.0" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<polygon points="460,320 452.3,306.0 467.7,306.0" fill="#111111"/>
<rect x="60" y="320" width="820" height="130" rx="8" fill="#F5F5F5" stroke="#767676" stroke-width="2"/>
