<polygon points="960,300 944.0,300.6 950.9,286.9" fill="#CC3A1C"/>
<text x="60" y="730" font-family="IBM Plex Sans" font-size="26" font-weight="700" fill="#111111" text-anchor="start">Bronze = silver + quarantine. Silver = scored.</text>
