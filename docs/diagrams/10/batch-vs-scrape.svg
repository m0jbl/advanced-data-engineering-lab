<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 800" width="1090" height="800">
<rect x="0" y="0" width="1090" height="800" fill="#FFFFFF"/>
<text x="60" y="150" font-family="IBM Plex Sans" font-size="26" font-weight="700" fill="#5C5C5C" text-anchor="start">Prometheus scrapes every 15 s</text>
<line x1="100" y1="190" x2="100" y2="250" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<line x1="210" y1="190" x2="210" y2="250" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<line x1="320" y1="190" x2="320" y2="250" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<line x1="430" y1="190" x2="430" y2="250" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<line x1="540" y1="190" x2="540" y2="250" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<line x1="650" y1="190" x2="650" y2="250" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<line x1="760" y1="190" x2="760" y2="250" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<line x1="870" y1="190" x2="870" y2="250" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<line x1="980" y1="190" x2="980" y2="250" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<text x="60" y="360" font-family="IBM Plex Sans" font-size="26" font-weight="700" fill="#5C5C5C" text-anchor="start">Batch job</text>
<rect x="330" y="390" width="260" height="80" rx="8" fill="#111111" stroke="none"/>
<text x="460" y="440" font-family="IBM Plex Mono" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">score_batch.py</text>
<text x="600" y="438" font-family="IBM Plex Sans" font-size="24" font-weight="700" fill="#CC3A1C" text-anchor="start">exits; counts gone</text>
<line x1="590" y1="380" x2="590" y2="480" stroke="#CC3A1C" stroke-width="3" stroke-linecap="round"/>
<text x="60" y="560" font-family="IBM Plex Sans" font-size="26" font-weight="700" fill="#111111" text-anchor="start">Push instead:</text>
<rect x="60" y="590" width="260" height="110" rx="8" fill="#111111" stroke="none"/>
<text x="190.0" y="637" font-family="IBM Plex Sans" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Job</text>
<text x="190.0" y="669" font-family="IBM Plex Sans" font-size="22" font-weight="400" fill="#FFFFFF" text-anchor="middle">pushes at end</text>
<line x1="320" y1="645" x2="406.0" y2="645.0" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<polygon points="420,645 406.0,652.7 406.0,637.3" fill="#111111"/>
<rect x="420" y="590" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="570.0" y="637" font-family="IBM Plex Sans" font-size="26" font-weight="700" fill="#111111" text-anchor="middle">Pushgateway</text>
<text x="570.0" y="669" font-family="IBM Plex Sans" font-size="22" font-weight="400" fill="#5C5C5C" text-anchor="middle">keeps last value</text>
<line x1="820" y1="645" x2="734.0" y2="645.0" stroke="#111111" stroke-width="3" stroke-linecap="round"/>
<polygon points="720,645 734.0,637.3 734.0,652.7" fill="#111111"/>
<rect x="820" y="590" width="220" height="110" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="930.0" y="637" font-family="IBM Plex Sans" font-size="26" font-weight="700" fill="#111111" text-anchor="middle">Prometheus</text>
<text x="930.0" y="669" font-family="IBM Plex Sans" font-size="22" font-weight="400" fill="#5C5C5C" text-anchor="middle">scrapes it</text>
</svg>
