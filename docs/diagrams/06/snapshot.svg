<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 520" width="1230" height="520">
<style>
.t{font-family:IBM Plex Sans;font-size:24px;fill:#111111}
.s{font-family:IBM Plex Sans;font-size:22px;fill:#5C5C5C}
.m{font-family:IBM Plex Mono;font-size:20px;fill:#111111}
.ms{font-family:IBM Plex Mono;font-size:20px;fill:#5C5C5C}
.mh{font-family:IBM Plex Mono;font-size:24px;fill:#111111}
.h{font-family:IBM Plex Sans Light;font-size:30px;fill:#111111}
.c{text-anchor:middle}
.w{fill:#FFFFFF}
.r{fill:#CC3A1C}
.file{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.miss{fill:#FFFFFF;stroke:#767676;stroke-width:2;stroke-dasharray:8 8}
.v{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.vd{fill:#111111}
.vx{fill:#FFFFFF;stroke:#CC3A1C;stroke-width:3;stroke-dasharray:8 6}
.rd{fill:#FFFFFF;stroke:#111111;stroke-width:3}
.ln{stroke:#111111;stroke-width:3;fill:none}
.ar{fill:#111111}
</style>
<text x="144" y="56" class="t c r">writer crashed</text>
<rect class="file" x="24" y="80" width="240" height="56" rx="8"/><text x="144" y="115" class="m c">part-1.parquet</text>
<rect class="file" x="24" y="150" width="240" height="56" rx="8"/><text x="144" y="185" class="m c">part-2.parquet</text>
<rect class="file" x="24" y="220" width="240" height="56" rx="8"/><text x="144" y="255" class="m c">part-3.parquet</text>
<rect class="miss" x="24" y="290" width="240" height="56" rx="8"/><text x="144" y="325" class="ms c">part-4.parquet</text>
<rect class="miss" x="24" y="360" width="240" height="56" rx="8"/><text x="144" y="395" class="ms c">part-5.parquet</text>
<text x="540" y="70" class="mh c">_delta_log</text>
<rect class="v" x="440" y="100" width="200" height="80" rx="10"/><text x="540" y="149" class="t c">version 5</text>
<rect class="vd" x="440" y="200" width="200" height="80" rx="10"/><text x="540" y="249" class="t c w">version 6</text>
<rect class="vx" x="440" y="300" width="200" height="80" rx="10"/><text x="540" y="349" class="t c r">no version 7</text>
<line class="ln" x1="860" y1="240" x2="656" y2="240"/><polygon class="ar" points="656,231 640,240 656,249"/>
<rect class="rd" x="860" y="180" width="346" height="120" rx="14"/>
<text x="1033" y="230" class="t c">Reader</text><text x="1033" y="268" class="s c">reads version 6</text>
<text x="615" y="470" class="h c">No partial reads</text>
</svg>
