<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 520" width="1230" height="520">
<style>
.t{font-family:IBM Plex Sans;font-size:24px;fill:#111111}
.h{font-family:IBM Plex Sans Light;font-size:28px;fill:#111111}
.m{font-family:IBM Plex Mono;font-size:22px;fill:#111111}
.mw{font-family:IBM Plex Mono;font-size:24px;fill:#FFFFFF}
.c{text-anchor:middle}
.r{fill:#CC3A1C}
.panel{fill:#FFFFFF;stroke:#767676;stroke-width:2}
.row{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.dup{fill:#FFFFFF;stroke:#CC3A1C;stroke-width:3}
.dark{fill:#111111}
.bad{fill:#FFFFFF;stroke:#CC3A1C;stroke-width:4}
.ok{fill:#FFFFFF;stroke:#111111;stroke-width:3}
.ln{stroke:#111111;stroke-width:3;fill:none}
.ar{fill:#111111}
</style>
<rect class="panel" x="24" y="24" width="567" height="472" rx="14"/>
<text x="48" y="70" class="h">Three rows for 42</text>
<rect class="dup" x="48" y="96" width="300" height="56"/><text x="68" y="132" class="m">42  block</text>
<rect class="dup" x="48" y="152" width="300" height="56"/><text x="68" y="188" class="m">42  edit reason</text>
<rect class="dup" x="48" y="208" width="300" height="56"/><text x="68" y="244" class="m">42  unblock</text>
<line class="ln" x1="348" y1="180" x2="384" y2="180"/><polygon class="ar" points="384,171 400,180 384,189"/>
<rect class="dark" x="400" y="140" width="160" height="80" rx="10"/><text x="480" y="189" class="mw c">MERGE</text>
<line class="ln" x1="480" y1="220" x2="480" y2="324"/><polygon class="ar" points="471,322 480,338 489,322"/>
<rect class="bad" x="48" y="340" width="512" height="80" rx="10"/><text x="304" y="389" class="t c r">error: duplicate keys</text>
<rect class="panel" x="639" y="24" width="567" height="472" rx="14"/>
<text x="663" y="70" class="h">Latest change only</text>
<rect class="row" x="663" y="152" width="300" height="56"/><text x="683" y="188" class="m">42  unblock</text>
<line class="ln" x1="963" y1="180" x2="999" y2="180"/><polygon class="ar" points="999,171 1015,180 999,189"/>
<rect class="dark" x="1015" y="140" width="160" height="80" rx="10"/><text x="1095" y="189" class="mw c">MERGE</text>
<line class="ln" x1="1095" y1="220" x2="1095" y2="324"/><polygon class="ar" points="1086,322 1095,338 1104,322"/>
<rect class="ok" x="663" y="340" width="512" height="80" rx="10"/><text x="919" y="389" class="t c">one commit</text>
</svg>
