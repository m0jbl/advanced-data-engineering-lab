<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 520" width="1230" height="520">
<style>
.t{font-family:IBM Plex Sans;font-size:24px;fill:#111111}
.s{font-family:IBM Plex Sans;font-size:22px;fill:#5C5C5C}
.c{text-anchor:middle}
.r{fill:#CC3A1C}
.win{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.ax{stroke:#767676;stroke-width:3}
.tick{stroke:#767676;stroke-width:2}
.gone{fill:#FFFFFF;stroke:#CC3A1C;stroke-width:3;stroke-dasharray:4 4}
.ok{fill:#111111}
</style>
<rect class="win" x="550" y="180" width="630" height="160" rx="10"/>
<text x="865" y="150" class="t c">readable versions</text>
<text x="300" y="150" class="t c r">time travel impossible</text>
<line class="ax" x1="100" y1="260" x2="1180" y2="260"/>
<line class="tick" x1="100" y1="248" x2="100" y2="272"/><line class="tick" x1="550" y1="200" x2="550" y2="320"/><line class="tick" x1="1180" y1="248" x2="1180" y2="272"/>
<circle class="gone" cx="100" cy="260" r="14"/><circle class="gone" cx="280" cy="260" r="14"/><circle class="gone" cx="370" cy="260" r="14"/>
<circle class="ok" cx="550" cy="260" r="14"/><circle class="ok" cx="640" cy="260" r="14"/><circle class="ok" cx="820" cy="260" r="14"/><circle class="ok" cx="910" cy="260" r="14"/><circle class="ok" cx="1000" cy="260" r="14"/><circle class="ok" cx="1090" cy="260" r="14"/><circle class="ok" cx="1180" cy="260" r="14"/>
<text x="100" y="390" class="s c">12 days ago</text>
<text x="550" y="390" class="s c">7 days ago</text>
<text x="1160" y="390" class="s c">now</text>
<text x="615" y="460" class="t c">VACUUM default retention: 7 days</text>
</svg>
