<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 800" width="1090" height="800">
<style>
.h{font-family:IBM Plex Sans Light;font-size:30px;fill:#111111}
.m{font-family:IBM Plex Mono;font-size:22px;fill:#111111}
.p{font-family:IBM Plex Mono;font-size:22px;fill:#5C5C5C}
.t{font-family:IBM Plex Sans;font-size:24px;fill:#CC3A1C}
.c{text-anchor:middle}
.w{fill:#FFFFFF}
.panel{fill:#FFFFFF;stroke:#767676;stroke-width:2}
.file{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.new{fill:#111111}
.ghost{fill:#FFFFFF;stroke:#CC3A1C;stroke-width:2;stroke-dasharray:8 8}
</style>
<rect class="panel" x="24" y="40" width="1042" height="320" rx="14"/>
<text x="60" y="90" class="h">Tuesday</text>
<text x="60" y="136" class="p">s3a://silver/transactions/</text>
<rect class="file" x="80" y="180" width="280" height="90" rx="8"/><text x="220" y="233" class="m c">part-a.parquet</text>
<rect class="file" x="405" y="180" width="280" height="90" rx="8"/><text x="545" y="233" class="m c">part-b.parquet</text>
<rect class="file" x="730" y="180" width="280" height="90" rx="8"/><text x="870" y="233" class="m c">part-c.parquet</text>
<rect class="panel" x="24" y="420" width="1042" height="340" rx="14"/>
<text x="60" y="470" class="h">Two overwrites later</text>
<text x="60" y="516" class="p">s3a://silver/transactions/</text>
<rect class="new" x="80" y="560" width="280" height="90" rx="8"/><text x="220" y="613" class="m c w">part-x.parquet</text>
<rect class="new" x="405" y="560" width="280" height="90" rx="8"/><text x="545" y="613" class="m c w">part-y.parquet</text>
<rect class="ghost" x="730" y="560" width="280" height="90" rx="8"/><text x="870" y="613" class="t c">a, b, c gone</text>
<text x="545" y="720" class="t c">Tuesday cannot be rebuilt</text>
</svg>
