<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 520" width="1230" height="520">
<style>
.h{font-family:IBM Plex Sans Light;font-size:30px;fill:#111111}
.s{font-family:IBM Plex Sans;font-size:22px;fill:#5C5C5C}
.t{font-family:IBM Plex Sans;font-size:24px;fill:#CC3A1C}
.n{font-family:IBM Plex Sans;font-size:26px;fill:#FFFFFF}
.c{text-anchor:middle}
.card{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.dot{fill:#111111}
.ans{fill:#FFFFFF;stroke:#CC3A1C;stroke-width:2}
</style>
<rect class="card" x="24" y="24" width="579" height="220" rx="14"/>
<circle class="dot" cx="76" cy="80" r="26"/><text x="76" y="89" class="n c">1</text>
<text x="120" y="90" class="h">Crash mid-write</text><text x="120" y="130" class="s">partial files visible</text>
<rect class="ans" x="120" y="160" width="320" height="56" rx="8"/><text x="140" y="196" class="t">Delta: atomic commit</text>
<rect class="card" x="627" y="24" width="579" height="220" rx="14"/>
<circle class="dot" cx="679" cy="80" r="26"/><text x="679" y="89" class="n c">2</text>
<text x="723" y="90" class="h">Upsert one row</text><text x="723" y="130" class="s">rewrite a whole partition</text>
<rect class="ans" x="723" y="160" width="320" height="56" rx="8"/><text x="743" y="196" class="t">Delta: MERGE</text>
<rect class="card" x="24" y="276" width="579" height="220" rx="14"/>
<circle class="dot" cx="76" cy="332" r="26"/><text x="76" y="341" class="n c">3</text>
<text x="120" y="342" class="h">What changed?</text><text x="120" y="382" class="s">no record of changes</text>
<rect class="ans" x="120" y="412" width="320" height="56" rx="8"/><text x="140" y="448" class="t">Delta: change feed</text>
<rect class="card" x="627" y="276" width="579" height="220" rx="14"/>
<circle class="dot" cx="679" cy="332" r="26"/><text x="679" y="341" class="n c">4</text>
<text x="723" y="342" class="h">Reproduce last week</text><text x="723" y="382" class="s">old files overwritten</text>
<rect class="ans" x="723" y="412" width="320" height="56" rx="8"/><text x="743" y="448" class="t">Delta: time travel</text>
</svg>
