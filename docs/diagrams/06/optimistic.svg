<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 520" width="1230" height="520">
<style>
.t{font-family:IBM Plex Sans;font-size:24px;fill:#111111}
.h{font-family:IBM Plex Sans Light;font-size:30px;fill:#111111}
.c{text-anchor:middle}
.w{fill:#FFFFFF}
.r{fill:#CC3A1C}
.box{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.dark{fill:#111111}
.hi{fill:#FFFFFF;stroke:#CC3A1C;stroke-width:4}
.ln{stroke:#111111;stroke-width:3;fill:none}
.ar{fill:#111111}
</style>
<text x="24" y="118" class="h">Writer A</text>
<rect class="box" x="200" y="70" width="200" height="80" rx="10"/><text x="300" y="119" class="t c">read v6</text>
<rect class="box" x="440" y="70" width="200" height="80" rx="10"/><text x="540" y="119" class="t c">write files</text>
<rect class="dark" x="680" y="70" width="200" height="80" rx="10"/><text x="780" y="119" class="t c w">commit v7</text>
<line class="ln" x1="400" y1="110" x2="424" y2="110"/><polygon class="ar" points="424,101 438,110 424,119"/>
<line class="ln" x1="640" y1="110" x2="664" y2="110"/><polygon class="ar" points="664,101 678,110 664,119"/>
<text x="24" y="338" class="h">Writer B</text>
<rect class="box" x="200" y="290" width="200" height="80" rx="10"/><text x="300" y="339" class="t c">read v6</text>
<rect class="box" x="440" y="290" width="200" height="80" rx="10"/><text x="540" y="339" class="t c">write files</text>
<rect class="hi" x="680" y="290" width="200" height="80" rx="10"/><text x="780" y="339" class="t c r">v7 taken</text>
<rect class="box" x="920" y="290" width="260" height="80" rx="10"/><text x="1050" y="339" class="t c">retry or fail</text>
<line class="ln" x1="400" y1="330" x2="424" y2="330"/><polygon class="ar" points="424,321 438,330 424,339"/>
<line class="ln" x1="640" y1="330" x2="664" y2="330"/><polygon class="ar" points="664,321 678,330 664,339"/>
<line class="ln" x1="880" y1="330" x2="904" y2="330"/><polygon class="ar" points="904,321 918,330 904,339"/>
<line class="ln" x1="780" y1="150" x2="780" y2="274"/><polygon class="ar" points="771,272 780,288 789,272"/>
<text x="800" y="224" class="t r">conflict</text>
<text x="615" y="460" class="h c">First commit wins</text>
</svg>
