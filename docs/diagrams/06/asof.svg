<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 800" width="1090" height="800">
<style>
.t{font-family:IBM Plex Sans;font-size:24px;fill:#111111}
.s{font-family:IBM Plex Sans;font-size:22px;fill:#5C5C5C}
.m{font-family:IBM Plex Mono;font-size:22px;fill:#111111}
.c{text-anchor:middle}
.snap{fill:#F5F5F5;stroke:#111111;stroke-width:2}
.p{fill:#111111}
.lr{stroke:#CC3A1C;stroke-width:3;fill:none}
.ax{stroke:#767676;stroke-width:3}
.tick{stroke:#767676;stroke-width:2}
</style>
<text x="40" y="130" class="s">feature snapshots</text>
<rect class="snap" x="70" y="170" width="160" height="70" rx="8"/><text x="150" y="214" class="m c">as of 17</text>
<rect class="snap" x="420" y="170" width="160" height="70" rx="8"/><text x="500" y="214" class="m c">as of 18</text>
<rect class="snap" x="770" y="170" width="160" height="70" rx="8"/><text x="850" y="214" class="m c">as of 19</text>
<line class="lr" x1="300" y1="486" x2="160" y2="240"/>
<line class="lr" x1="650" y1="486" x2="510" y2="240"/>
<line class="lr" x1="760" y1="486" x2="530" y2="240"/>
<line class="lr" x1="960" y1="486" x2="870" y2="240"/>
<text x="40" y="440" class="s">payments</text>
<circle class="p" cx="300" cy="500" r="14"/><circle class="p" cx="650" cy="500" r="14"/><circle class="p" cx="760" cy="500" r="14"/><circle class="p" cx="960" cy="500" r="14"/>
<line class="ax" x1="40" y1="620" x2="1050" y2="620"/>
<line class="tick" x1="150" y1="608" x2="150" y2="632"/><line class="tick" x1="500" y1="608" x2="500" y2="632"/><line class="tick" x1="850" y1="608" x2="850" y2="632"/>
<text x="150" y="666" class="s c">17 Nov</text><text x="500" y="666" class="s c">18 Nov</text><text x="850" y="666" class="s c">19 Nov</text>
<text x="545" y="740" class="t c">latest earlier snapshot wins</text>
</svg>
