<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 800" width="1090" height="800">
<rect x="0" y="0" width="1090" height="800" fill="#FFFFFF"/>
<text x="60" y="100" font-family="IBM Plex Sans" font-size="28" font-weight="700" fill="#CC3A1C" text-anchor="start">One salt</text>
<rect x="60" y="130" width="300" height="100" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="210.0" y="171" font-family="IBM Plex Sans" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">payments</text>
<text x="210.0" y="202" font-family="IBM Plex Mono" font-size="22" font-weight="400" fill="#5C5C5C" text-anchor="middle">key a1f…</text>
<rect x="680" y="130" width="340" height="100" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="850.0" y="171" font-family="IBM Plex Sans" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">loyalty dataset</text>
<text x="850.0" y="202" font-family="IBM Plex Mono" font-size="22" font-weight="400" fill="#5C5C5C" text-anchor="middle">key a1f…</text>
<line x1="360" y1="180" x2="680" y2="180" stroke="#CC3A1C" stroke-width="4" stroke-linecap="round"/>
<text x="520" y="166" font-family="IBM Plex Sans" font-size="22" font-weight="700" fill="#CC3A1C" text-anchor="middle">joins again</text>
<text x="60" y="400" font-family="IBM Plex Sans" font-size="28" font-weight="700" fill="#111111" text-anchor="start">Salt per purpose</text>
<rect x="60" y="430" width="300" height="100" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="210.0" y="471" font-family="IBM Plex Sans" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">payments</text>
<text x="210.0" y="502" font-family="IBM Plex Mono" font-size="22" font-weight="400" fill="#5C5C5C" text-anchor="middle">key a1f…</text>
<rect x="680" y="430" width="340" height="100" rx="8" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
<text x="850.0" y="471" font-family="IBM Plex Sans" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">loyalty dataset</text>
<text x="850.0" y="502" font-family="IBM Plex Mono" font-size="22" font-weight="400" fill="#5C5C5C" text-anchor="middle">key 7c2…</text>
<line x1="360" y1="480" x2="680" y2="480" stroke="#767676" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 8"/>
<text x="520" y="466" font-family="IBM Plex Sans" font-size="22" font-weight="400" fill="#5C5C5C" text-anchor="middle">no join</text>
<text x="60" y="680" font-family="IBM Plex Sans" font-size="22" font-weight="400" fill="#5C5C5C" text-anchor="start">Keyed HMAC per purpose works the same way</text>
</svg>
