<circle class="p" cx="260" cy="120" r="10"/><circle class="p" cx="380" cy="120" r="10"/><circle class="pr" cx="530" cy="120" r="10"/><circle class="pr" cx="590" cy="120" r="10"/><circle class="p" cx="700" cy="120" r="10"/><circle class="p" cx="820" cy="120" r="10"/>
