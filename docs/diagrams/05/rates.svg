<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 800" width="1090" height="800">
<style>
.t{font-family:IBM Plex Sans;font-size:24px;fill:#111111}
.s{font-family:IBM Plex Sans;font-size:22px;fill:#5C5C5C}
.e{text-anchor:end}
.r{fill:#CC3A1C}
.ax{stroke:#767676;stroke-width:3;fill:none}
.in{stroke:#CC3A1C;stroke-width:5;fill:none}
.pr{stroke:#111111;stroke-width:5;fill:none}
.lag{fill:#CC3A1C;fill-opacity:.15}
</style>
<text x="100" y="60" class="s">rows per second</text>
<path class="ax" d="M100 80 V600 H1010"/>
<text x="1010" y="640" class="s e">time</text>
<polygon class="lag" points="508,330 550,300 700,230 850,210 1000,200 1000,330"/>
<polyline class="in" points="100,460 300,440 450,380 550,300 700,230 850,210 1000,200"/>
<line class="pr" x1="100" y1="330" x2="1000" y2="330"/>
<text x="1000" y="180" class="t e r">input rate</text>
<text x="1000" y="370" class="t e">processing rate</text>
<text x="840" y="294" class="t e r">lag grows</text>
</svg>
