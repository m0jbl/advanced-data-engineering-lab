<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 520" width="1230" height="520">
<style>
.t{font-family:IBM Plex Sans;font-size:24px;fill:#111111}
.s{font-family:IBM Plex Sans;font-size:22px;fill:#5C5C5C}
.m{font-family:IBM Plex Mono;font-size:22px;fill:#5C5C5C}
.h{font-family:IBM Plex Sans Light;font-size:30px;fill:#CC3A1C}
.c{text-anchor:middle}
.r{fill:#CC3A1C}
.seg{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.gap{fill:#CC3A1C;fill-opacity:.15;stroke:#CC3A1C;stroke-width:3}
.mk{stroke:#111111;stroke-width:4}
</style>
<text x="24" y="196" class="s">Kafka offsets</text>
<rect class="seg" x="24" y="220" width="456" height="80"/><text x="252" y="268" class="t c">scored</text>
<rect class="gap" x="480" y="220" width="380" height="80"/><text x="670" y="268" class="t c r">never scored</text>
<rect class="seg" x="860" y="220" width="346" height="80"/><text x="1033" y="268" class="t c">scored</text>
<line class="mk" x1="480" y1="150" x2="480" y2="320"/>
<line class="mk" x1="860" y1="150" x2="860" y2="320"/>
<text x="480" y="130" class="t c">last commit</text>
<text x="860" y="130" class="t c">restart at latest</text>
<text x="480" y="356" class="m c">5,000</text>
<text x="860" y="356" class="m c">7,400</text>
<text x="615" y="450" class="h c">Lost without an error</text>
</svg>
