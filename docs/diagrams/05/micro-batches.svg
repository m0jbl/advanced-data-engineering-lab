<rect class="dark" x="414" y="200" width="250" height="100" rx="12"/><text x="539" y="242" class="t c w">batch 2</text><text x="539" y="276" class="s c w">same plan</text>
<rect class="dark" x="764" y="200" width="250" height="100" rx="12"/><text x="889" y="242" class="t c w">batch 3</text><text x="889" y="276" class="s c w">same plan</text>
