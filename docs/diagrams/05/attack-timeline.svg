<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 800" width="1090" height="800">
<style>
.t{font-family:IBM Plex Sans;font-size:24px;fill:#111111}
.s{font-family:IBM Plex Sans;font-size:22px;fill:#5C5C5C}
.h{font-family:IBM Plex Sans Light;font-size:30px;fill:#111111}
.c{text-anchor:middle}
.w{fill:#FFFFFF}
.r{fill:#CC3A1C}
.ax{stroke:#767676;stroke-width:3}
.tick{stroke:#767676;stroke-width:2}
.small{fill:#FFFFFF;stroke:#CC3A1C;stroke-width:4}
.big{fill:#CC3A1C}
.br{stroke:#111111;stroke-width:2;fill:none}
.dash{stroke:#CC3A1C;stroke-width:3;stroke-dasharray:10 8;fill:none}
.dark{fill:#111111}
</style>
<text x="80" y="70" class="h">Exchange counter</text>
<path class="br" d="M266 184 V168 H731 V184"/>
<text x="498" y="152" class="t c">5 minutes</text>
<line class="ax" x1="80" y1="260" x2="1010" y2="260"/>
<line class="tick" x1="80" y1="250" x2="80" y2="270"/><line class="tick" x1="545" y1="250" x2="545" y2="270"/><line class="tick" x1="1010" y1="250" x2="1010" y2="270"/>
<circle class="small" cx="266" cy="260" r="12"/><circle class="small" cx="359" cy="260" r="12"/><circle class="small" cx="452" cy="260" r="12"/><circle class="small" cx="545" cy="260" r="12"/><circle class="small" cx="638" cy="260" r="12"/>
<circle class="big" cx="731" cy="260" r="28"/>
<text x="80" y="310" class="s c">10:00</text><text x="545" y="310" class="s c">10:05</text><text x="1010" y="310" class="s c">10:10</text>
<text x="452" y="360" class="t c r">small, card not present</text>
<text x="800" y="230" class="t r">large payment</text>
<path class="dash" d="M731 288 V420"/>
<text x="80" y="470" class="s">next day</text>
<line class="ax" x1="80" y1="560" x2="1010" y2="560"/>
<rect class="dark" x="640" y="600" width="370" height="100" rx="12"/>
<text x="825" y="660" class="t c w">06:00 batch alert</text>
<line class="tick" x1="825" y1="550" x2="825" y2="600"/>
<text x="80" y="660" class="h r">Alert after the loss</text>
</svg>
