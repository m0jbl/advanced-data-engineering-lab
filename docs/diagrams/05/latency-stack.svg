<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 800" width="1090" height="800">
<style>
.t{font-family:IBM Plex Sans;font-size:26px;fill:#111111}
.s{font-family:IBM Plex Sans;font-size:22px;fill:#5C5C5C}
.h{font-family:IBM Plex Sans Light;font-size:30px;fill:#111111}
.c{text-anchor:middle}
.r{fill:#CC3A1C}
.seg{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.hi{fill:#FFFFFF;stroke:#CC3A1C;stroke-width:4}
.br{stroke:#111111;stroke-width:3;fill:none}
</style>
<rect class="seg" x="200" y="60" width="500" height="70"/><text x="450" y="104" class="t c">producer send</text>
<rect class="seg" x="200" y="130" width="500" height="70"/><text x="450" y="174" class="t c">Kafka write</text>
<rect class="seg" x="200" y="200" width="500" height="130"/><text x="450" y="274" class="t c">trigger wait</text>
<rect class="hi" x="200" y="330" width="500" height="220"/><text x="450" y="449" class="t c r">batch processing</text>
<rect class="seg" x="200" y="550" width="500" height="90"/><text x="450" y="604" class="t c">sink write</text>
<path class="br" d="M730 60 H750 V640 H730"/>
<text x="770" y="342" class="h">decision</text><text x="770" y="380" class="h">latency</text>
<text x="450" y="710" class="s c">window close: stateful only</text>
</svg>
