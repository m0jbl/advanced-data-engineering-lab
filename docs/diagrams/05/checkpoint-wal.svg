.dash{stroke:#767676;stroke-width:3;stroke-dasharray:8 6;fill:none}
.ar{fill:#111111}
</style>
<rect class="box" x="24" y="80" width="264" height="120" rx="12"/><circle class="dot" cx="64" cy="140" r="22"/><text x="64" y="149" class="n c">1</text><text x="100" y="149" class="t">log offsets</text>
<rect class="box" x="330" y="80" width="264" height="120" rx="12"/><circle class="dot" cx="370" cy="140" r="22"/><text x="370" y="149" class="n c">2</text><text x="406" y="149" class="t">run batch</text>
<rect class="box" x="636" y="80" width="264" height="120" rx="12"/><circle class="dot" cx="676" cy="140" r="22"/><text x="676" y="149" class="n c">3</text><text x="712" y="149" class="t">write sinks</text>
<rect class="box" x="942" y="80" width="264" height="120" rx="12"/><circle class="dot" cx="982" cy="140" r="22"/><text x="982" y="149" class="n c">4</text><text x="1018" y="149" class="t">log commit</text>
<line class="ln" x1="288" y1="140" x2="314" y2="140"/><polygon class="ar" points="314,131 328,140 314,149"/>
<line class="ln" x1="594" y1="140" x2="620" y2="140"/><polygon class="ar" points="620,131 634,140 620,149"/>
<line class="ln" x1="900" y1="140" x2="926" y2="140"/><polygon class="ar" points="926,131 940,140 926,149"/>
<line class="dash" x1="156" y1="200" x2="156" y2="290"/>
<line class="dash" x1="1074" y1="200" x2="1074" y2="290"/>
<rect class="ck" x="24" y="290" width="1182" height="110" rx="12"/>
<text x="156" y="354" class="m c">offsets/42</text>
<text x="615" y="354" class="h c">checkpoint</text>
<text x="1074" y="354" class="m c r">commits/41</text>
<text x="615" y="460" class="t c r">No commit: batch 42 reruns</text>
