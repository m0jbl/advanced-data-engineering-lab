<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1230 520" width="1230" height="520">
<style>
.t{font-family:IBM Plex Sans;font-size:22px;fill:#111111}
.s{font-family:IBM Plex Sans;font-size:20px;fill:#5C5C5C}
.c{text-anchor:middle}
.r{fill:#CC3A1C}
.win{fill:#F5F5F5;stroke:#767676;stroke-width:2}
.hot{fill:#FFFFFF;stroke:#CC3A1C;stroke-width:4}
.open{fill:#FFFFFF;stroke:#767676;stroke-width:2;stroke-dasharray:8 8}
.p{fill:#111111}
.ax{stroke:#767676;stroke-width:3}
.tick{stroke:#767676;stroke-width:2}
</style>
<text x="24" y="104" class="t">tumbling, 5 min</text>
<rect class="hot" x="280" y="60" width="400" height="80" rx="8"/><text x="480" y="108" class="t c r">6 payments: alert</text>
<rect class="win" x="680" y="60" width="400" height="80" rx="8"/><text x="880" y="108" class="s c">2 payments</text>
<rect class="open" x="1080" y="60" width="100" height="80" rx="8"/>
<circle class="p" cx="360" cy="220" r="10"/><circle class="p" cx="480" cy="220" r="10"/><circle class="p" cx="520" cy="220" r="10"/><circle class="p" cx="560" cy="220" r="10"/><circle class="p" cx="600" cy="220" r="10"/><circle class="p" cx="640" cy="220" r="10"/><circle class="p" cx="760" cy="220" r="10"/><circle class="p" cx="1000" cy="220" r="10"/>
<text x="24" y="228" class="t">one passenger</text>
<line class="ax" x1="280" y1="250" x2="1180" y2="250"/>
<line class="tick" x1="280" y1="240" x2="280" y2="260"/><line class="tick" x1="680" y1="240" x2="680" y2="260"/><line class="tick" x1="1080" y1="240" x2="1080" y2="260"/>
<text x="280" y="286" class="s c">10:00</text><text x="680" y="286" class="s c">10:05</text><text x="1080" y="286" class="s c">10:10</text>
<text x="24" y="404" class="t">sliding, 1 min step</text>
<rect class="win" x="280" y="320" width="400" height="34" rx="6"/>
<rect class="win" x="360" y="362" width="400" height="34" rx="6"/>
<rect class="win" x="440" y="404" width="400" height="34" rx="6"/>
<rect class="win" x="520" y="446" width="400" height="34" rx="6"/>
<text x="940" y="470" class="s">overlapping windows</text>
</svg>
