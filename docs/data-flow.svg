<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 540" width="1440" height="540" role="img" aria-labelledby="t d">
  <title id="t">Data flow: batch, CDC and live paths</title>
  <desc id="d">Batch: simulator to raw CSV files, bronze in MinIO, silver Delta by day, features as of each day, then score. CDC: Postgres blocklist to Debezium, Kafka and the silver blocklist, then score. Scoring writes gold scores and is evaluated against ground truth. Live: producer to the airport.transactions topic, Spark Streaming, then fraud alerts in Kafka and stream scores in Delta.</desc>
  <defs>
    <style>
      .sans{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}
      .light{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;font-weight:300}
      .cond{font-family:'IBM Plex Sans Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:600;letter-spacing:.08em}
      .mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace}
      .hand{font-family:'Architects Daughter','Bradley Hand','Segoe Print','Comic Sans MS',cursive}
      .n{fill:#FFFFFF;stroke:#111111;stroke-width:1}
      .h{font-size:16px;font-weight:600;fill:#111111}
      .s{font-size:13px;fill:#5C5C5C}
      .sm{font-size:11.5px;fill:#5C5C5C}
      .kick{font-size:12px;fill:#5C5C5C}
      .tag{font-size:11px;fill:#FFFFFF;letter-spacing:.06em}
      .w{fill:none;stroke:#5C5C5C;stroke-width:1.5}
      .r{fill:none;stroke:#CC3A1C;stroke-width:2.5}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5C5C5C"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#CC3A1C"/></marker>
  </defs>

  <rect width="1440" height="540" fill="#FFFFFF"/>
  <rect x="16" y="16" width="1408" height="508" fill="none" stroke="#111111" stroke-width="3"/>

  <text x="40" y="54" class="cond kick">DATA FLOW</text>
  <text x="40" y="88" class="light" font-size="30" fill="#111111">Three paths into one set of fraud rules</text>
  <!-- logo -->
  <g transform="translate(1356,34) scale(0.75)">
    <path d="M11.32,49.36 A27,27 0 1 1 52.68,49.36" fill="none" stroke="#111111" stroke-width="6"/>
    <path d="M18.98,42.93 A17,17 0 1 1 45.02,42.93" fill="none" stroke="#111111" stroke-width="6"/>
    <circle cx="32" cy="32" r="6" fill="#CC3A1C"/>
  </g>
  <line x1="40" y1="108" x2="1400" y2="108" stroke="#D9D9D9" stroke-width="0.5"/>

  <!-- ===== lane labels ===== -->
  <text x="40" y="146" class="cond" font-size="15" fill="#111111">BATCH</text>
  <text x="40" y="166" class="mono sm">batch jobs</text>
  <rect x="40" y="176" width="92" height="18" fill="#111111"/><text x="47" y="189" class="cond tag">LAB 04–07</text>

  <text x="40" y="256" class="cond" font-size="15" fill="#111111">CDC</text>
  <text x="40" y="276" class="mono sm">blocklist_from_cdc.py</text>
  <rect x="40" y="286" width="62" height="18" fill="#111111"/><text x="47" y="299" class="cond tag">LAB 08</text>

  <line x1="40" y1="338" x2="1400" y2="338" stroke="#D9D9D9" stroke-width="0.5"/>
  <circle cx="45" cy="391" r="5" fill="#CC3A1C"/>
  <text x="56" y="396" class="cond" font-size="15" fill="#CC3A1C">LIVE</text>
  <text x="40" y="416" class="mono sm">stream_fraud.py</text>
  <rect x="40" y="426" width="62" height="18" fill="#111111"/><text x="47" y="439" class="cond tag">LAB 05</text>

  <!-- ===== batch lane (centre y 160) ===== -->
  <rect x="200" y="130" width="150" height="60" class="n"/>
  <text x="214" y="156" class="sans h">simulator</text><text x="214" y="177" class="sans s">60 days, seed 42</text>
  <rect x="374" y="130" width="150" height="60" class="n"/>
  <text x="388" y="156" class="sans h">raw files</text><text x="388" y="177" class="mono sm">data/raw/*.csv</text>
  <rect x="548" y="130" width="150" height="60" class="n"/>
  <text x="562" y="156" class="sans h">bronze</text><text x="562" y="177" class="sans s">MinIO, as landed</text>
  <rect x="722" y="130" width="150" height="60" class="n"/>
  <text x="736" y="156" class="sans h">silver</text><text x="736" y="177" class="sans s">Delta, by day</text>
  <rect x="896" y="130" width="150" height="60" class="n"/>
  <text x="910" y="156" class="sans h">features</text><text x="910" y="177" class="sans s">as of each day</text>
  <g class="w">
    <line x1="350" y1="160" x2="374" y2="160" marker-end="url(#a)"/>
    <line x1="524" y1="160" x2="548" y2="160" marker-end="url(#a)"/>
    <line x1="698" y1="160" x2="722" y2="160" marker-end="url(#a)"/>
    <line x1="872" y1="160" x2="896" y2="160" marker-end="url(#a)"/>
    <line x1="1046" y1="160" x2="1089" y2="160" marker-end="url(#a)"/>
  </g>

  <!-- ===== CDC lane (centre y 270) ===== -->
  <rect x="200" y="240" width="150" height="60" class="n"/>
  <text x="214" y="266" class="sans h">Postgres</text><text x="214" y="287" class="sans s">blocklist table</text>
  <rect x="374" y="240" width="150" height="60" class="n"/>
  <text x="388" y="266" class="sans h">Debezium</text><text x="388" y="287" class="sans s">reads the DB log</text>
  <rect x="548" y="240" width="150" height="60" class="n"/>
  <text x="562" y="266" class="sans h">Kafka</text><text x="562" y="287" class="sans s">change events</text>
  <rect x="722" y="240" width="150" height="60" class="n"/>
  <text x="736" y="266" class="sans h">blocklist</text><text x="736" y="287" class="sans s">silver, MERGE</text>
  <g class="w">
    <line x1="350" y1="270" x2="374" y2="270" marker-end="url(#a)"/>
    <line x1="524" y1="270" x2="548" y2="270" marker-end="url(#a)"/>
    <line x1="698" y1="270" x2="722" y2="270" marker-end="url(#a)"/>
    <line x1="872" y1="270" x2="1089" y2="270" marker-end="url(#a)"/>
  </g>

  <!-- ===== score + outputs ===== -->
  <rect x="1090" y="130" width="140" height="170" fill="#FFFFFF" stroke="#111111" stroke-width="2"/>
  <text x="1106" y="186" class="sans h" font-size="20">score</text>
  <text x="1106" y="210" class="sans s">7 rules</text>
  <text x="1106" y="230" class="sans s">alert at ≥ 50</text>
  <rect x="1106" y="246" width="62" height="18" fill="#111111"/><text x="1113" y="259" class="cond tag">LAB 06</text>

  <rect x="1254" y="130" width="146" height="60" class="n"/>
  <text x="1268" y="156" class="sans h">gold scores</text><text x="1268" y="177" class="mono sm">gold/fraud_scores</text>
  <rect x="1254" y="240" width="146" height="60" class="n"/>
  <text x="1268" y="266" class="sans h">evaluate</text><text x="1268" y="287" class="sans s">vs ground truth</text>
  <g class="w">
    <line x1="1231" y1="160" x2="1254" y2="160" marker-end="url(#a)"/>
    <line x1="1327" y1="190" x2="1327" y2="240" marker-end="url(#a)"/>
  </g>

  <!-- ===== live lane (centre y 420) ===== -->
  <rect x="200" y="390" width="150" height="60" class="n"/>
  <text x="214" y="416" class="sans h">producer</text><text x="214" y="437" class="sans s">live terminals</text>
  <rect x="374" y="390" width="150" height="60" class="n"/>
  <text x="388" y="416" class="sans h">Kafka topic</text><text x="388" y="437" class="mono sm" font-size="10.5" style="font-size:10.5px">airport.transactions</text>
  <rect x="548" y="390" width="150" height="60" fill="#FFFFFF" stroke="#CC3A1C" stroke-width="3"/>
  <text x="562" y="416" class="sans h">Spark Streaming</text><text x="562" y="437" class="sans s">same 7 rules</text>
  <rect x="722" y="362" width="190" height="56" class="n"/>
  <text x="736" y="386" class="sans h">fraud alerts</text><text x="736" y="406" class="mono sm">airport.fraud-alerts</text>
  <rect x="722" y="430" width="190" height="56" class="n"/>
  <text x="736" y="454" class="sans h">stream scores</text><text x="736" y="474" class="mono sm">gold/stream_scores</text>
  <line x1="350" y1="420" x2="374" y2="420" class="r" marker-end="url(#ar)"/>
  <line x1="524" y1="420" x2="546.5" y2="420" class="r" marker-end="url(#ar)"/>
  <path d="M699.5,410 H710 V390 H722" class="r" marker-end="url(#ar)"/>
  <path d="M699.5,430 H710 V458 H722" class="w" marker-end="url(#a)"/>

  <!-- annotation -->
  <g class="hand" font-size="17" fill="#CC3A1C">
    <text x="960" y="404">one rule function: batch scores yesterday,</text>
    <text x="960" y="426">streaming scores the next second</text>
    <line x1="956" y1="398" x2="1150" y2="306" stroke="#CC3A1C" stroke-width="1"/><circle cx="1151" cy="304" r="3" fill="#CC3A1C"/>
  </g>
  <text x="960" y="490" class="sans s">Both paths read the blocklist: a blocked passenger scores 100.</text>
</svg>
