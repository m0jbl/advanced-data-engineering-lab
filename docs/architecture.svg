<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 890" width="1440" height="890" role="img" aria-labelledby="t d">
  <title id="t">Advanced Data Engineering lab: architecture and the lab that uses each part</title>
  <desc id="d">Payment terminals and a passenger database feed Kafka and Debezium. Spark runs a live scorer and batch jobs on a Delta lakehouse in MinIO. Alerts, scores and a masked dataset are served. Prefect, Prometheus and Grafana, CI and governance run underneath. Each part is tagged with its lab exercise.</desc>
  <defs>
    <style>
      .sans{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif}
      .light{font-family:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;font-weight:300}
      .cond{font-family:'IBM Plex Sans Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:600;letter-spacing:.08em}
      .mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace}
      .hand{font-family:'Architects Daughter','Bradley Hand','Segoe Print','Comic Sans MS',cursive}
      .card{fill:#FFFFFF;stroke:#111111;stroke-width:1}
      .addon{fill:#FFFFFF;stroke:#111111;stroke-width:1;stroke-dasharray:6 4}
      .wire{fill:none;stroke:#5C5C5C;stroke-width:1.5}
      .live{fill:none;stroke:#CC3A1C;stroke-width:2.5}
      .kick{font-size:12px;fill:#5C5C5C}
      .h{font-size:18px;font-weight:600;fill:#111111}
      .b{font-size:14.5px;fill:#111111}
      .m{font-size:13px;fill:#5C5C5C}
      .tag{font-size:11px;fill:#FFFFFF;letter-spacing:.06em}
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5C5C5C"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#CC3A1C"/></marker>
  </defs>

  <rect width="1440" height="890" fill="#FFFFFF"/>
  <rect x="16" y="16" width="1408" height="858" fill="none" stroke="#111111" stroke-width="3"/>

  <!-- header -->
  <text x="40" y="58" class="cond kick">ADVANCED DATA ENGINEERING · OPEN LAB</text>
  <text x="40" y="100" class="light" font-size="38" fill="#111111">Every payment, from terminal to trusted decision</text>
  <text x="40" y="128" class="sans" font-size="15" fill="#5C5C5C">One airport payments dataset · 12 hands-on labs · runs on a laptop or in GitHub Codespaces</text>

  <!-- column labels -->
  <g class="cond kick">
    <text x="40" y="168">SOURCES</text>
    <text x="256" y="168">INGEST</text>
    <text x="512" y="168">PROCESS</text>
    <text x="798" y="168">STORE</text>
    <text x="1014" y="168">SERVE</text>
  </g>
  <line x1="40" y1="176" x2="1220" y2="176" stroke="#D9D9D9" stroke-width="0.5"/>

  <!-- ===== SOURCES ===== -->
  <rect x="40" y="196" width="180" height="128" class="card"/>
  <text x="56" y="226" class="sans h">Payment terminals</text>
  <text x="56" y="252" class="sans b">simulator, 10 airports</text>
  <text x="56" y="274" class="sans b">7 business lines</text>
  <rect x="56" y="292" width="104" height="20" fill="#111111"/><text x="64" y="306" class="cond tag">LAB 01 · 02</text>

  <rect x="40" y="430" width="180" height="128" class="addon"/>
  <text x="56" y="460" class="sans h">Passenger DB</text>
  <text x="56" y="486" class="sans b">Postgres 16</text>
  <text x="56" y="508" class="mono m">passenger_blocklist</text>
  <rect x="56" y="526" width="64" height="20" fill="#111111"/><text x="64" y="540" class="cond tag">LAB 08</text>

  <!-- ===== INGEST ===== -->
  <rect x="256" y="196" width="220" height="128" class="card"/>
  <text x="272" y="226" class="sans h">Kafka 4.4 · KRaft</text>
  <text x="272" y="252" class="mono m">airport.transactions</text>
  <text x="272" y="274" class="mono m">airport.fraud-alerts</text>
  <rect x="272" y="292" width="64" height="20" fill="#111111"/><text x="280" y="306" class="cond tag">LAB 02</text>

  <rect x="256" y="344" width="220" height="70" class="card"/>
  <text x="272" y="372" class="sans h">Schema Registry 8.4</text>
  <text x="272" y="396" class="sans b">payment contract</text>
  <rect x="396" y="382" width="64" height="20" fill="#111111"/><text x="404" y="396" class="cond tag">LAB 03</text>

  <rect x="256" y="430" width="220" height="128" class="addon"/>
  <text x="272" y="460" class="sans h">Debezium 3.7</text>
  <text x="272" y="486" class="sans b">change data capture</text>
  <text x="272" y="508" class="sans b">Kafka Connect</text>
  <rect x="272" y="526" width="64" height="20" fill="#111111"/><text x="280" y="540" class="cond tag">LAB 08</text>

  <!-- ===== PROCESS (Spark) ===== -->
  <rect x="512" y="196" width="250" height="128" fill="#FFFFFF" stroke="#CC3A1C" stroke-width="3"/>
  <circle cx="530" cy="215" r="5" fill="#CC3A1C"/>
  <text x="542" y="220" class="cond kick" style="fill:#CC3A1C">LIVE PATH</text>
  <text x="528" y="248" class="sans h">Spark 4.2 live scorer</text>
  <text x="528" y="272" class="sans b">7 rules · alert at score ≥ 50</text>
  <rect x="528" y="292" width="64" height="20" fill="#111111"/><text x="536" y="306" class="cond tag">LAB 05</text>

  <rect x="512" y="344" width="250" height="214" class="card"/>
  <text x="528" y="374" class="sans h">Spark 4.2 batch jobs</text>
  <g class="sans b">
    <text x="528" y="402">validate → silver</text>
    <text x="528" y="426">features, no leakage</text>
    <text x="528" y="450">score → precision gate</text>
    <text x="528" y="474">MERGE the blocklist</text>
    <text x="528" y="498">mask for analysts</text>
  </g>
  <rect x="528" y="522" width="218" height="20" fill="#111111"/><text x="536" y="536" class="cond tag">LAB 04 · 06 · 07 · 08 · 12</text>

  <!-- ===== STORE (lakehouse) ===== -->
  <rect x="798" y="196" width="180" height="362" class="card"/>
  <text x="814" y="226" class="sans h">Delta lakehouse</text>
  <text x="814" y="248" class="sans m">Delta 4.4 on MinIO (S3)</text>
  <g stroke="#D9D9D9" stroke-width="1">
    <line x1="798" y1="264" x2="978" y2="264"/>
    <line x1="798" y1="330" x2="978" y2="330"/>
    <line x1="798" y1="396" x2="978" y2="396"/>
  </g>
  <text x="814" y="290" class="sans h" font-size="16">bronze</text><text x="814" y="314" class="sans m">raw files, as landed</text>
  <text x="814" y="356" class="sans h" font-size="16">silver</text><text x="814" y="380" class="sans m">validated, deduplicated</text>
  <text x="814" y="422" class="sans h" font-size="16">gold</text><text x="814" y="446" class="sans m">features, scores, masked</text>
  <rect x="799" y="462" width="178" height="62" fill="#F5F5F5"/>
  <line x1="798" y1="462" x2="978" y2="462" stroke="#D9D9D9"/>
  <text x="814" y="488" class="sans h" font-size="16">quarantine</text><text x="814" y="510" class="sans m">rejected, with a reason</text>
  <rect x="814" y="532" width="136" height="20" fill="#111111"/><text x="822" y="546" class="cond tag">LAB 04 · 06 · 07</text>

  <!-- ===== SERVE ===== -->
  <rect x="1014" y="196" width="206" height="110" class="card"/>
  <text x="1030" y="226" class="sans h">Fraud alerts</text>
  <text x="1030" y="250" class="sans b">to fraud operations</text>
  <text x="1030" y="272" class="sans m">within seconds</text>
  <rect x="1142" y="280" width="64" height="20" fill="#111111"/><text x="1150" y="294" class="cond tag">LAB 05</text>

  <rect x="1014" y="322" width="206" height="110" class="card"/>
  <text x="1030" y="352" class="sans h">Fraud scores</text>
  <text x="1030" y="376" class="mono m">gold/fraud_scores</text>
  <text x="1030" y="398" class="sans m">precision and recall</text>
  <rect x="1142" y="406" width="64" height="20" fill="#111111"/><text x="1150" y="420" class="cond tag">LAB 06</text>

  <rect x="1014" y="448" width="206" height="110" class="card"/>
  <text x="1030" y="478" class="sans h">Analyst dataset</text>
  <text x="1030" y="502" class="mono m">transactions_masked</text>
  <text x="1030" y="524" class="sans m">no direct identifiers</text>
  <rect x="1142" y="532" width="64" height="20" fill="#111111"/><text x="1150" y="546" class="cond tag">LAB 12</text>

