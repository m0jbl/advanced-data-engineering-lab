    <text x="40" y="590">block at 10:00, stopped seconds later</text>
    <line x1="300" y1="576" x2="330" y2="562" stroke="#CC3A1C" stroke-width="1"/><circle cx="331" cy="560" r="3" fill="#CC3A1C"/>
