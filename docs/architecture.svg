  <rect x="341" y="656" width="277" height="104" class="addon"/>
  <text x="357" y="686" class="sans h">Observability</text>
  <text x="357" y="710" class="sans b">Prometheus 3.16 · Grafana 13.3</text>
  <rect x="357" y="726" width="64" height="20" fill="#111111"/><text x="365" y="740" class="cond tag">LAB 10</text>

  <rect x="642" y="656" width="277" height="104" class="card"/>
  <text x="658" y="686" class="sans h">CI/CD and tests</text>
  <text x="658" y="710" class="sans b">rule, contract and Spark tests</text>
  <rect x="658" y="726" width="64" height="20" fill="#111111"/><text x="666" y="740" class="cond tag">LAB 09</text>

