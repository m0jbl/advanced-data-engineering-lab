[project]
name = "advanced-data-engineering-lab"
version = "0.1.0"
description = "Host tooling for the Advanced Data Engineering lab (generator, producer, tests, Prefect flow)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    # <2.15: no musl wheel, so the Alpine dev container builds it against Alpine's librdkafka 2.14
    "confluent-kafka>=2.4,<2.15",
    "prometheus-client>=0.20",
    "pytest>=8.0",
    "jsonschema>=4.21",
    "prefect==3.9.4",
]

[tool.uv]
package = false
