global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: pushgateway          # pipeline metrics pushed by Spark jobs (Lab 10)
    honor_labels: true
    static_configs: [{targets: ["pushgateway:9091"]}]
  - job_name: kafka                # consumer lag from kafka-exporter
    static_configs: [{targets: ["kafka-exporter:9308"]}]
