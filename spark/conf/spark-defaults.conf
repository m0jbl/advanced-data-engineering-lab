# Settings for every spark-submit in spark-master (mounted at /opt/spark/conf/spark-defaults.conf).
# Jars for Kafka, S3A and Delta are baked into the image (spark/Dockerfile), so no --packages.
spark.master                     spark://spark-master:7077
spark.driver.memory              768m
spark.driver.host                spark-master
spark.executor.memory            768m
spark.executor.cores             1
spark.cores.max                  1
spark.sql.extensions             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog  org.apache.spark.sql.delta.catalog.DeltaCatalog
