name: lab-ci
on:
  pull_request:
    paths: ["spark/jobs/**", "tests/**", "schemas/**", "src/**", "params.yaml", "pyproject.toml", "uv.lock", ".python-version"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: PYTHONPATH=src uv run --locked python -m pytest tests -q
