name: spark-image

# Builds the lab's ready-made Spark image for amd64 (Codespaces, Intel) and arm64 (Apple silicon)
# and publishes it to ghcr.io/majlisofai/advanced-data-engineering-spark.
on:
  push:
    branches: [main]
    paths: [spark/Dockerfile, spark/bake_jars.py, .github/workflows/spark-image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/majlisofai/advanced-data-engineering-spark
  TAG: "4.2.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: spark
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Spark 4.2 + Delta 4.4.1 + Kafka/S3A connectors for the Advanced Data Engineering lab
          cache-from: type=gha
          cache-to: type=gha,mode=max
